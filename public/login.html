<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión · CruceOCR</title>
<style>
  :root{
    --bg:#080d11; --surface:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16); --text:#e9f1ef; --text-dim:#9db0ac; --text-dimmer:#5f716c;
    --accent-1:#34d399; --accent-2:#22d3ee; --gradient:linear-gradient(135deg,#34d399,#22d3ee);
    --accent-ink:#05231b; --rojo:#fb7185; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .mesh::before,.mesh::after{content:"";position:absolute;width:600px;height:600px;border-radius:50%;filter:blur(130px);opacity:.16}
  .mesh::before{top:-200px;left:-160px;background:var(--accent-1)}
  .mesh::after{bottom:-220px;right:-160px;background:var(--accent-2)}
  .wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:22px;padding:34px 30px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .brand-mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--gradient);color:var(--accent-ink);box-shadow:0 8px 22px -8px rgba(34,211,238,.55)}
  .brand-name{font-size:17px;font-weight:700}
  .brand-name b{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--text-dim);font-size:13.5px;margin:0 0 24px;line-height:1.5}
  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dimmer);margin:0 0 7px}
  .campo{margin-bottom:16px}
  input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:13px 14px;font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input:hover{border-color:var(--border-strong)}
  input:focus{outline:none;border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
  .btn{width:100%;margin-top:6px;padding:14px;border:none;border-radius:12px;background:var(--gradient);color:var(--accent-ink);
    font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 14px 34px -12px rgba(34,211,238,.55);transition:transform .18s,box-shadow .18s,opacity .18s}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(34,211,238,.7)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .error{display:none;margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(251,113,133,.09);
    border:1px solid rgba(251,113,133,.3);color:#fda4af;font-size:13px}
  .error.show{display:block}
  .volver{display:block;text-align:center;margin-top:20px;color:var(--text-dimmer);font-size:12.5px;text-decoration:none}
  .volver:hover{color:var(--accent-1)}
  .spinner{width:16px;height:16px;border:2px solid rgba(5,35,27,.35);border-top-color:var(--accent-ink);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="mesh"></div>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <span class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </span>
      <span class="brand-name">Cruce<b>OCR</b></span>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresa tus credenciales para usar la herramienta de cruce.</p>

    <form id="form-login" autocomplete="on">
      <div class="campo">
        <label for="usuario">Correo / usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="admin@gmail.com" autocomplete="username" required autofocus />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn" id="btn" type="submit"><span id="btn-txt">Entrar</span></button>
      <div class="error" id="error"></div>
    </form>

    <a class="volver" href="/">← Volver al inicio</a>
  </div>
</div>

<script>
  const form = document.getElementById('form-login');
  const btn = document.getElementById('btn');
  const btnTxt = document.getElementById('btn-txt');
  const errorBox = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true;
    btnTxt.innerHTML = '<span class="spinner"></span>';
    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        window.location.href = '/app';
        return;
      }
      throw new Error(data.error || 'No se pudo iniciar sesión.');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
      btn.disabled = false;
      btnTxt.textContent = 'Entrar';
      document.getElementById('password').select();
    }
  });
</script>
</body>
</html>
