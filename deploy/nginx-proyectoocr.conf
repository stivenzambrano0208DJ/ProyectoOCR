# Configuracion de Nginx para ProyectoOCR (reverse proxy hacia Node en 127.0.0.1:3578)
# 1) Reemplaza TU-DOMINIO.com por tu dominio real.
# 2) Guardalo en /etc/nginx/sites-available/proyectoocr y actívalo (ver DESPLIEGUE.md).
# 3) Certbot añadirá automáticamente el bloque HTTPS (443) al ejecutarlo.

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com www.TU-DOMINIO.com;

    # Los PDF y Excel pueden pesar bastante; sube el límite de subida.
    client_max_body_size 100M;

    # ---- (OPCIONAL) Proteger con usuario y contraseña ----
    # Para activarlo: crea el archivo de contraseñas (ver DESPLIEGUE.md, sección
    # "Opcional: proteger con contraseña") y descomenta estas dos líneas:
    # auth_basic "Acceso restringido";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3578;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El OCR de muchas páginas puede tardar; tiempos de espera generosos.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
